name: Verify Token Current
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift toolchain
        run: swift --version
      - name: Test accounting and file monitoring
        run: swift test
      - name: Check scripts
        run: bash -n Scripts/*.sh
      - name: Test installation and update recovery
        run: python3 -m unittest discover -s Tests/Installer -v
      - name: Build universal native application
        run: ARCHES="arm64 x86_64" SIGNING_MODE=adhoc Scripts/package_app.sh release
      - name: Verify bundle
        run: |
          plutil -lint build/TokenCurrent.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 build/TokenCurrent.app
          lipo build/TokenCurrent.app/Contents/MacOS/TokenCurrent -verify_arch arm64 x86_64
      - name: Smoke test native launch
        run: |
          open build/TokenCurrent.app
          for attempt in {1..20}; do
            if pgrep -x TokenCurrent > /dev/null; then break; fi
            sleep 0.5
          done
          sleep 3
          pgrep -x TokenCurrent
          pkill -x TokenCurrent
      - name: Archive app and brand kit
        run: |
          ditto -c -k --keepParent build/TokenCurrent.app build/TokenCurrent-macos-universal.zip
          mkdir -p build/TokenCurrent-brand-kit
          cp assets/brand/*.svg assets/brand/README.md build/TokenCurrent-brand-kit/
          cp .build/TokenCurrent.iconset/icon_512x512@2x.png build/TokenCurrent-brand-kit/TokenCurrent-icon-1024.png
          cp build/TokenCurrent.app/Contents/Resources/Icon.icns build/TokenCurrent-brand-kit/TokenCurrent.icns
          ditto -c -k --keepParent build/TokenCurrent-brand-kit build/TokenCurrent-brand-kit.zip
      - name: Package and verify drag-to-Applications DMG
        run: |
          Scripts/create_dmg.sh build/TokenCurrent.app build/TokenCurrent-macos-universal.dmg
          mkdir -p build/dmg-check
          hdiutil attach -quiet -readonly -noverify -noautoopen -mountpoint "$PWD/build/dmg-check" build/TokenCurrent-macos-universal.dmg
          trap 'hdiutil detach "$PWD/build/dmg-check" -quiet' EXIT
          test "$(readlink build/dmg-check/Applications)" = /Applications
          codesign --verify --deep --strict build/dmg-check/TokenCurrent.app
          cmp build/TokenCurrent.app/Contents/MacOS/TokenCurrent build/dmg-check/TokenCurrent.app/Contents/MacOS/TokenCurrent
      - uses: actions/upload-artifact@v4
        with:
          name: TokenCurrent-macos-release
          path: |
            build/*.zip
            build/*.dmg
