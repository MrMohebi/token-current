name: Verify network agents
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: network
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - name: Agent initialization and private API smoke test
        shell: bash
        run: |
          go build -o agent ./cmd/token-current-agent
          ./agent init --config "$RUNNER_TEMP/agent/config.json" --listen 127.0.0.1:18790
          ./agent run --config "$RUNNER_TEMP/agent/config.json" &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18790/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18790/healthz
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:18790/api/v1/snapshot)" = 401
      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) 'install/install.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: python3 -m unittest discover -s Tests/Network -v
      - name: Build and smoke test private Docker relay
        run: |
          docker compose -f network/deploy/compose.yaml up -d --build
          trap 'docker compose -f network/deploy/compose.yaml down' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/healthz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8787/healthz
          test "$(docker compose -f network/deploy/compose.yaml exec -T relay id -u | tr -d '\r')" = 10001
  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install and launch Windows scheduled task
        shell: pwsh
        run: |
          Push-Location network
          go build -o install/token-current-agent.exe ./cmd/token-current-agent
          try {
            & ./install/install.ps1
            $ready = $false
            for ($i=0; $i -lt 20; $i++) {
              try { $r = Invoke-RestMethod http://127.0.0.1:8790/healthz; if ($r.ok) { $ready = $true; break } } catch {}
              Start-Sleep -Seconds 1
            }
            if (!$ready) { throw 'Scheduled agent did not start' }
            if ((Get-ScheduledTask -TaskName 'Token Current Agent').State -ne 'Running') { throw 'Task is not running' }
          } finally {
            Stop-ScheduledTask -TaskName 'Token Current Agent' -ErrorAction SilentlyContinue
            Unregister-ScheduledTask -TaskName 'Token Current Agent' -Confirm:$false -ErrorAction SilentlyContinue
            Pop-Location
          }
  package:
    needs: [test, windows-install, end-to-end]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: Scripts/package_network.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TokenCurrent-network-release
          path: build/network/*
